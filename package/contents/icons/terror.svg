<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5a0b0b"/>
      <stop offset="1" stop-color="#c0261a"/>
    </linearGradient>
    <radialGradient id="bone" cx="0.5" cy="0.35" r="0.65">
